<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings | Novera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sidebar">
    <a href="index.html" class="sidebar-logo">Novera</a>
    <div class="nav-menu">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="process.html" class="nav-link">Process</a>
      <a href="impact.html" class="nav-link">Impact</a>
      <a href="volunteer.html" class="nav-link">Join Us</a>
      <a href="settings.html" class="nav-link active">Settings</a>
    </div>
  </nav>

  <main>
    <section class="mega-section reveal">
      <h1 class="hero-title">Settings.</h1>
      
      <div class="grid">
        <div class="card" style="grid-column: span 12;">
          <h3 style="margin-bottom: 20px; opacity: 0.5;">Preferences</h3>
          <div class="settings-row">
            <div>
              <p style="font-weight: 600;">Dark Mode</p>
              <p style="font-size: 0.8rem; color: var(--text-secondary);">Reduce eye strain in low light.</p>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
          </div>
          <div class="settings-row">
            <div>
              <p style="font-weight: 600;">Motion Effects</p>
              <p style="font-size: 0.8rem; color: var(--text-secondary);">Enable smooth transition animations.</p>
            </div>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          </div>
        </div>

        <div class="card" style="grid-column: span 6;">
          <h3 style="margin-bottom: 10px;">Security</h3>
          <p style="font-size: 0.9rem; margin-bottom: 20px;">Protect your Novera ID and personal data.</p>
          <a href="#" class="btn-apple" style="font-size: 0.8rem;">Update Password</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
