<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | Novera</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-container { background: var(--secondary-bg); border-radius: 32px; display: flex; height: 500px; overflow: hidden; border: 1px solid var(--border); }
        .settings-nav { width: 200px; background: rgba(0,0,0,0.02); border-right: 1px solid var(--border); padding: 20px; }
        .settings-content { flex: 1; padding: 40px; background: #fff; overflow-y: auto; }
        .settings-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="index.html" class="logo-squircle">N</a>
        <div class="nav-menu">
            <a href="index.html" class="nav-link">Overview</a>
            <a href="process.html" class="nav-link">Process</a>
            <a href="impact.html" class="nav-link">Impact</a>
            <a href="volunteer.html" class="nav-link">Join Us</a>
            <a href="settings.html" class="nav-link active">Settings</a>
        </div>
    </nav>
    <main>
        <section class="section">
            <h1>Settings.</h1>
            <div class="settings-container">
                <div class="settings-nav">
                    <p style="font-weight:600; font-size:14px; color:var(--accent);">Appearance</p>
                    <p style="font-size:14px; margin-top:15px; opacity:0.5;">Account</p>
                    <p style="font-size:14px; margin-top:15px; opacity:0.5;">Privacy</p>
                </div>
                <div class="settings-content">
                    <div class="settings-row">
                        <div><p style="font-weight:600;">Eco-Dark Mode</p></div>
                        <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                    </div>
                    <div class="settings-row">
                        <div><p style="font-weight:600;">Reduce Motion</p></div>
                        <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                    </div>
                </div>
            </div>
        </section>
        <footer>© 2026 Novera Inc.</footer>
    </main>
</body>
</html>
