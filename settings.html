<main>
    <section class="mega-section reveal">
        <h1 class="hero-title">Settings.</h1>
        <p class="hero-desc">Urus akaun dan peribadikan pengalaman Novera anda.</p>

        <div class="grid">
            <div class="settings-box reveal">
                <div class="settings-nav">
                    <a href="#" class="nav-link active">Appearance</a>
                    <a href="#" class="nav-link">Notifications</a>
                    <a href="#" class="nav-link">Privacy</a>
                    <a href="#" class="nav-link">Akaun</a>
                </div>
                <div class="settings-content">
                    <h3 style="margin-bottom: 25px; color: var(--gold);">Appearance</h3>
                    
                    <div class="settings-row">
                        <div>
                            <p style="font-weight: 600;">Dark Mode</p>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Jimat bateri dengan rupa gelap.</p>
                        </div>
                        <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                    </div>

                    <div class="settings-row">
                        <div>
                            <p style="font-weight: 600;">Reduce Motion</p>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Permudahkan animasi untuk kelajuan.</p>
                        </div>
                        <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
