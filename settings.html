<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | Novera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo-container"><a href="index.html"><img src="assets/images/logonovera.png" class="main-logo"></a></div>
        <div class="nav-menu">
            <a href="index.html" class="nav-link">Overview</a>
            <a href="process.html" class="nav-link">Process</a>
            <a href="impact.html" class="nav-link">Impact</a>
            <a href="volunteer.html" class="nav-link">Join Us</a>
            <a href="settings.html" class="nav-link active">Settings</a>
        </div>
    </nav>
    <main>
        <section class="mega-section visible">
            <h1>Settings.</h1>
            <div class="settings-box">
                <div style="flex:1;">
                    <h3 style="margin-bottom:25px; color:var(--accent);">Antaramuka</h3>
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid var(--border);">
                        <div><p style="font-weight:600;">Eco-Dark Mode</p><p style="font-size:0.8rem; opacity:0.5;">Jimat tenaga skrin anda.</p></div>
                        <div class="switch" onclick="this.classList.toggle('on')"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0;">
                        <div><p style="font-weight:600;">Smooth Motion</p><p style="font-size:0.8rem; opacity:0.5;">Aktifkan animasi transisi Apple.</p></div>
                        <div class="switch on" onclick="this.classList.toggle('on')"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
