<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings | NOVERA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">NOVERA🌿</a>
    <ul class="nav-menu">
      <li class="nav-item"><a href="index.html" class="nav-link">🏠 <span>Home</span></a></li>
      <li class="nav-item"><a href="process.html" class="nav-link">🔄 <span>The Process</span></a></li>
      <li class="nav-item"><a href="volunteer.html" class="nav-link">🌿 <span>Volunteer</span></a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link active">⚙️ <span>Settings</span></a></li>
    </ul>
  </aside>

  <main class="reveal">
    <h1 style="font-family: 'Playfair Display'; font-size: 2.5rem; margin-bottom: 40px; color: var(--accent);">Account Settings</h1>
    
    <div class="card" style="margin-bottom: 30px;">
      <h2 style="margin-bottom: 20px;">Profile Information</h2>
      <div class="settings-row">
        <div><p>Display Name</p><small style="opacity: 0.6;">MinimallyFoliumTech Official</small></div>
        <button class="btn-accent" style="width: auto; padding: 5px 15px;">Edit</button>
      </div>
      <div class="settings-row">
        <div><p>Email Address</p><small style="opacity: 0.6;">tech@novera.green</small></div>
        <button class="btn-accent" style="width: auto; padding: 5px 15px;">Change</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 20px;">Preferences</h2>
      <div class="settings-row">
        <p>Email Notifications</p>
        <input type="checkbox" checked style="width: 20px; height: 20px;">
      </div>
      <div class="settings-row">
        <p>Dark Mode (Eco-Vision)</p>
        <span style="color: var(--accent); font-weight: bold;">Enabled</span>
      </div>
      <div class="settings-row" style="border: none;">
        <p style="color: var(--danger);">Deactivate Account</p>
        <button style="background: var(--danger); border: none; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer;">Delete</button>
      </div>
    </div>
  </main>
</body>
</html>
