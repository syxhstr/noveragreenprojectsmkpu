<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | Novera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <img src="assets/images/logonovera.png" class="main-logo" alt="Logo">
        <div class="nav-menu">
            <a href="index.html" class="nav-link" data-en="Overview" data-ms="Utama">Overview</a>
            <a href="process.html" class="nav-link" data-en="Process" data-ms="Proses">Process</a>
            <a href="settings.html" class="nav-link active" data-en="Settings" data-ms="Tetapan">Settings</a>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-ms" onclick="changeLang('ms')">MS</button>
        </div>
    </nav>
    <main>
        <section class="section">
            <h1 class="reveal" data-en="Settings." data-ms="Tetapan.">Settings.</h1>
            <div class="settings-box reveal">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <p data-en="Eco Mode" data-ms="Mod Eko">Eco Mode</p>
                    <div class="switch on" onclick="this.classList.toggle('on')"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.to(".reveal", { opacity: 1, y: 0, duration: 1, ease: "power3.out" });
        function changeLang(l) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            document.querySelectorAll('[data-en]').forEach(el => { el.innerHTML = el.getAttribute('data-' + l); });
        }
    </script>
</body>
</html>
