<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | NoveraGreen</title>
    <link rel="icon" type="image/png" href="assets/images/logonovera.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="brand-group">
                <img src="assets/images/logonovera.png" class="logo-main-display" alt="Logo">
                <span class="nav-divider"></span>
                <span class="sub-brand">by MinimallyFoliumTech</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Overview</a>
                <a href="volunteer.html">Join Us</a>
                <a href="settings.html" class="active">Settings</a>
            </div>
        </div>
    </nav>

    <main class="section-padding">
        <h2 class="section-title" data-en="System Preferences" data-ms="Tetapan Sistem">System Preferences</h2>
        
        <div class="bento-grid">
            <div class="bento-card full">
                <h3 data-en="Experience Settings" data-ms="Tetapan Pengalaman">Experience Settings</h3>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding: 20px; background: #222; border-radius: 20px;">
                    <div>
                        <strong data-en="Reduce Motion" data-ms="Kurangkan Gerakan">Reduce Motion</strong>
                        <p style="font-size: 0.9rem; color: #888;" data-en="Disable GSAP animations for faster performance." data-ms="Tutup animasi GSAP untuk prestasi lebih laju.">Disable GSAP animations.</p>
                    </div>
                    <input type="checkbox" id="motion-toggle" style="width: 25px; height: 25px; accent-color: var(--accent);">
                </div>

                <div style="margin-top: 20px; padding: 20px; background: #222; border-radius: 20px;">
                    <strong data-en="Clear Site Data" data-ms="Padam Data Laman">Clear Site Data</strong>
                    <p style="font-size: 0.9rem; color: #888; margin-bottom: 15px;" data-en="Reset all language and motion preferences." data-ms="Set semula semua tetapan bahasa dan gerakan.">Reset preferences.</p>
                    <button onclick="clearData()" class="apple-btn" style="background: #ff3b30; padding: 10px 20px; font-size: 0.8rem;" data-en="Reset Now" data-ms="Set Semula">Reset Now</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Logik Settings
        const motionToggle = document.getElementById('motion-toggle');

        // Load saved setting
        if(localStorage.getItem('reduceMotion') === 'true') {
            motionToggle.checked = true;
        }

        // Simpan bila user klik
        motionToggle.addEventListener('change', () => {
            localStorage.setItem('reduceMotion', motionToggle.checked);
            alert(motionToggle.checked ? "Animations Disabled" : "Animations Enabled");
            window.location.reload(); 
        });

        function clearData() {
            localStorage.clear();
            alert("Data Cleared!");
            window.location.href = 'index.html';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
