<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Impact | Novera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <img src="assets/images/logonovera.png" class="main-logo" alt="Logo">
        <div class="nav-menu">
            <a href="index.html" class="nav-link" data-en="Overview" data-ms="Utama">Overview</a>
            <a href="process.html" class="nav-link" data-en="Process" data-ms="Proses">Process</a>
            <a href="impact.html" class="nav-link active" data-en="Impact" data-ms="Impak">Impact</a>
            <a href="volunteer.html" class="nav-link" data-en="Join Us" data-ms="Sertai Kami">Join Us</a>
            <a href="settings.html" class="nav-link" data-en="Settings" data-ms="Tetapan">Settings</a>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-ms" onclick="changeLang('ms')">MS</button>
        </div>
    </nav>

    <main>
        <section class="section">
            <h1 class="reveal" data-en="Environmental<br>Impact." data-ms="Impak<br>Alam Sekitar.">Environmental<br>Impact.</h1>
            <p class="hero-desc reveal" data-en="Real data, real change for the planet." data-ms="Data sebenar, perubahan nyata untuk planet.">Real data, real change for the planet.</p>
            
            <div class="grid reveal">
                <div class="card" style="background:#1d1d1f; color:#fff;">
                    <h2 style="font-size:4rem; margin-bottom:10px;">452kg</h2>
                    <p data-en="Leaf waste collected this month." data-ms="Sisa daun dikumpul bulan ini.">Leaf waste collected this month.</p>
                </div>
                <div class="card">
                    <h2 style="font-size:4rem; color:var(--gold); margin-bottom:10px;">1.2t</h2>
                    <p data-en="CO2 emissions prevented." data-ms="Pelepasan CO2 berjaya dihalang.">CO2 emissions prevented.</p>
                </div>
                <div class="card" style="grid-column: span 12; text-align: center;">
                    <h3 data-en="340+ Supporters" data-ms="340+ Penyokong">340+ Supporters</h3>
                    <p data-en="Our community is growing every day across Malaysia." data-ms="Komuniti kami berkembang setiap hari di seluruh Malaysia.">Our community is growing every day across Malaysia.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.to(".reveal", { opacity: 1, y: 0, duration: 1, stagger: 0.2, ease: "power3.out" });
        function changeLang(l) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + l);
            });
        }
    </script>
</body>
</html>
