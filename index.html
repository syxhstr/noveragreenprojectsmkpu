<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Novera | Overview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="sidebar">
        <img src="assets/images/logonovera.png" class="main-logo" alt="Logo">
        <div class="nav-menu">
            <a href="index.html" class="nav-link active" data-en="Overview" data-ms="Utama">Overview</a>
            <a href="process.html" class="nav-link" data-en="Process" data-ms="Proses">Process</a>
            <a href="settings.html" class="nav-link" data-en="Settings" data-ms="Tetapan">Settings</a>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-ms" onclick="changeLang('ms')">MS</button>
        </div>
    </nav>

    <main>
        <section class="section">
            <h1 class="reveal" data-en="Nature.<br>Re-imagined." data-ms="Alam.<br>Dicipta Semula.">Nature.<br>Re-imagined.</h1>
            <p class="hero-desc reveal" data-en="Premium stationery from 100% leaf waste." data-ms="Alat tulis premium dari 100% sisa daun kering.">Premium stationery from 100% leaf waste.</p>
            <div class="grid reveal">
                <div class="card">
                    <h3 data-en="Zero Trees" data-ms="Sifar Pokok">Zero Trees</h3>
                    <p data-en="We save forests by using fallen leaves." data-ms="Kami selamatkan hutan dengan daun yang jatuh.">We save forests by using fallen leaves.</p>
                </div>
                <div class="card" style="background:#000; color:#fff;">
                    <h3 data-en="Pure Texture" data-ms="Tekstur Asli">Pure Texture</h3>
                    <p data-en="Every sheet is unique." data-ms="Setiap helaian adalah unik.">Every sheet is unique.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Animasi GSAP (Paling Gempak)
        gsap.to(".reveal", { opacity: 1, y: 0, duration: 1, stagger: 0.2, ease: "power3.out" });

        // Fungsi Tukar Bahasa
        function changeLang(l) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + l);
            });
        }
    </script>
</body>
</html>
