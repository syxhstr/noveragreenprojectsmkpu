<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success | Novera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; text-align:center;">

    <main style="margin-left:0; width:100%;">
        <section class="section">
            <h1 class="reveal" data-en="Success." data-ms="Berjaya.">Success.</h1>
            <p class="hero-desc reveal" 
               data-en="Thank you for reaching out. Our team will contact you shortly." 
               data-ms="Terima kasih kerana menghubungi kami. Pasukan kami akan hubungi anda segera.">
               Thank you for reaching out. Our team will contact you shortly.
            </p>
            
            <div class="reveal" style="margin-top:40px;">
                <a href="index.html" class="nav-link active" style="display:inline-block; padding:15px 40px; border-radius:40px;"

                </a>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Animasi muncul dari tengah
        gsap.to(".reveal", { 
            opacity: 1, 
            y: 0, 
            duration: 1.5, 
            stagger: 0.3, 
            ease: "power4.out" 
        });

        // Check bahasa dari page sebelum ni (optional)
