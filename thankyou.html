<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Success | NOVERA</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="refresh" content="5;url=index.html">
</head>
<body style="justify-content: center; align-items: center; text-align: center;">
  <main class="reveal">
    <div style="font-size: 5rem; margin-bottom: 20px;">✅</div>
    <h1 style="font-family: 'Playfair Display'; color: var(--accent); font-size: 3rem;">Thank You!</h1>
    <p style="opacity: 0.7; margin: 20px 0;">Your registration was successful. You are now part of the green revolution.</p>
    <div style="width: 100px; height: 2px; background: var(--accent); margin: 30px auto; position: relative; overflow: hidden;">
      <div style="position: absolute; width: 100%; height: 100%; background: white; left: -100%; animation: loading 5s linear forwards;"></div>
    </div>
    <p style="font-size: 0.8rem; opacity: 0.5;">Redirecting back to home in 5 seconds...</p>
    <a href="index.html" class="btn-accent" style="display: inline-block; width: auto; margin-top: 20px; text-decoration: none;">Return Now</a>
  </main>

  <style>
    @keyframes loading { to { left: 0; } }
  </style>
</body>
</html>
