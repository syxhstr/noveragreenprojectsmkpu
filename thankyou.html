<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selesai | NOVERA GREEN</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="particle-container"></div>

    <section style="height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="glass-panel text-center animate-scroll" style="max-width: 600px;">
            <div id="check-icon" style="font-family: 'Playfair Display', serif; font-size: 5rem; color: var(--gold); margin-bottom: 20px;">✓</div>
            <h1 style="font-family: 'Playfair Display', serif; font-size: 3.5rem; margin-bottom: 15px;">Terima <span class="gold-text">Kasih.</span></h1>
            <p class="body-text" style="margin-bottom: 40px;">
                Permohonan anda telah selamat diterima di pangkalan data kami. Pihak kami akan menyemak profil anda dan menghubungi anda dalam masa yang terdekat.
            </p>
            <a href="index.html" class="gold-btn">Kembali ke Halaman Utama</a>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        // Animasi pop-up untuk tick mark
        gsap.from("#check-icon", {
            scale: 0,
            opacity: 0,
            duration: 1,
            ease: "back.out(1.7)",
            delay: 0.3
        });
    </script>
</body>
</html>
