<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success | NoveraGreen</title>
    <link rel="icon" type="image/png" href="assets/images/logonovera.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
    <div class="hero-content">
        <div id="check" style="font-size: 5rem; color: var(--petronas-green); margin-bottom: 20px;">✓</div>
        <h1 style="font-size: 4rem;">Application Received.</h1>
        <p style="margin-bottom: 30px; color: var(--text-dim);">Our team will review your profile and contact you within 48 hours.</p>
        <a href="index.html" class="apple-btn">Return to Overview</a>
    </div>

    <script>
        gsap.from("#check", { scale: 0, duration: 1, ease: "elastic.out(1, 0.3)" });
        gsap.from("h1, p, a", { opacity: 0, y: 20, stagger: 0.2, delay: 0.5 });
    </script>
</body>
</html>
