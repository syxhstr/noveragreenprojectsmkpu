<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">
    <div class="glass-card" style="max-width:600px; width:100%; text-align:center;">
        <h2 style="color:var(--gold); margin-bottom:40px;">Sertai Pergerakan Kami</h2>
        <form action="thankyou.html">
            <input type="text" placeholder="Nama Penuh" class="input-field" required>
            <input type="email" placeholder="Alamat Emel" class="input-field" required>
            <input type="tel" placeholder="No. Telefon (Optional)" class="input-field">
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:30px;">
                <label style="border:1px solid var(--border); padding:20px; border-radius:15px; cursor:pointer;">
                    <input type="radio" name="type" required> Sukarelawan
                </label>
                <label style="border:1px solid var(--border); padding:20px; border-radius:15px; cursor:pointer;">
                    <input type="radio" name="type"> Sumbang Daun
                </label>
            </div>
            <button type="submit" class="nav-btn" style="width:100%; border:none; cursor:pointer;">HANTAR</button>
        </form>
    </div>
</body>
</html>
