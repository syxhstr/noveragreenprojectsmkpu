<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Join Us | Novera</title>
  <link rel="stylesheet" href="style.css">
  <style>
    input, select {
      width: 100%; padding: 20px; background: var(--secondary-bg);
      border: 1px solid transparent; border-radius: 16px;
      margin: 10px 0 30px; font-size: 1.1rem; transition: 0.3s;
    }
    input:focus { background: #fff; border-color: var(--accent); outline: none; }
    label { font-weight: 600; font-size: 0.85rem; opacity: 0.8; margin-left: 5px; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <a href="index.html" class="sidebar-logo">Novera</a>
    <div class="nav-menu">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="process.html" class="nav-link">Process</a>
      <a href="impact.html" class="nav-link">Impact</a>
      <a href="volunteer.html" class="nav-link active">Join Us</a>
    </div>
  </nav>

  <main>
    <section class="mega-section reveal">
      <span class="hero-tag">Community</span>
      <h1 class="hero-title">Be part of <br>the solution.</h1>
      
      <div class="card" style="grid-column: span 12; max-width: 700px;">
        <form action="thankyou.html">
          <label>NAME</label>
          <input type="text" placeholder="Your full name" required>

          <label>INTEREST</label>
          <select required>
            <option>I want to donate leaves</option>
            <option>I want to join the production team</option>
          </select>

          <button type="submit" class="btn-apple" style="width: 100%; border: none; cursor: pointer;">Submit Request</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
