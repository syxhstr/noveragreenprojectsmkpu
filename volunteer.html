<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volunteer | NOVERA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-group { margin-bottom: 20px; }
    input, select, textarea { 
      width: 100%; padding: 12px; background: var(--primary); 
      border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 8px; 
      color: white; margin-top: 8px;
    }
    label { font-size: 0.9rem; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">NOVERA🌿</a>
    <ul class="nav-menu">
      <li class="nav-item"><a href="index.html" class="nav-link">🏠 <span>Home</span></a></li>
      <li class="nav-item"><a href="process.html" class="nav-link">🔄 <span>The Process</span></a></li>
      <li class="nav-item"><a href="volunteer.html" class="nav-link active">🌿 <span>Volunteer</span></a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link">⚙️ <span>Settings</span></a></li>
    </ul>
  </aside>

  <main class="reveal">
    <div style="max-width: 600px; margin: 0 auto; background: var(--secondary); padding: 40px; border-radius: 30px; border: 1px solid rgba(197, 160, 89, 0.1);">
      <h1 style="color:var(--accent); margin-bottom: 10px;">Join the Initiative</h1>
      <p style="margin-bottom: 30px; opacity: 0.6;">Register to donate biomass or join our production team.</p>
      
      <form action="thankyou.html">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="example@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Involvement Type</label>
          <select>
            <option>Leaf Donor (Biomass)</option>
            <option>Production Assistant</option>
            <option>Educational Outreach</option>
          </select>
        </div>
        <button type="submit" class="btn-accent" style="margin-top: 10px;">Submit Application</button>
      </form>
    </div>
  </main>
</body>
</html>
