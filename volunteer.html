<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Join Us | Novera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sidebar">
    <a href="index.html" class="sidebar-logo">Novera</a>
    <div class="nav-menu">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="process.html" class="nav-link">Process</a>
      <a href="impact.html" class="nav-link">Impact</a>
      <a href="volunteer.html" class="nav-link active">Join Us</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </div>
  </nav>

  <main>
    <section class="mega-section reveal">
      <span class="hero-tag">Community</span>
      <h1 class="hero-title">Start your <br>contribution.</h1>
      
      <div class="card" style="grid-column: span 12; max-width: 800px; margin-top: 40px; background: #fff; border: 1px solid #d2d2d7;">
        <form action="thankyou.html">
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">FULL NAME</label>
          <input type="text" placeholder="John Appleseed" style="width:100%; padding:20px; border:1px solid #d2d2d7; border-radius:12px; margin:10px 0 30px;" required>
          
          <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary);">INTEREST</label>
          <select style="width:100%; padding:20px; border:1px solid #d2d2d7; border-radius:12px; margin:10px 0 30px;" required>
            <option>Donating Dry Leaves</option>
            <option>Research & Development</option>
          </select>
          
          <button type="submit" class="btn-apple" style="width: 100%; border:none; cursor:pointer;">Send Application</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
