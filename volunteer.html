<nav class="glass-nav">
    <img src="assets/images/logonovera.png" class="main-logo">
    <a href="index.html" class="nav-btn" style="padding: 10px 20px; font-size: 10px;">KEMBALI KE UTAMA</a>
</nav>

<main class="volunteer-main">
    <div class="hero-overlay" style="background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 50px; border-radius: 40px; width: 100%; max-width: 600px;">
        <h2 class="hero-title" style="font-size: 2rem;">Sertai Pergerakan</h2>
        
        <form>
            <div class="role-grid">
                <label class="role-card" onclick="selectRole(this)">
                    <input type="radio" name="role" value="volunteer">
                    <span style="font-size: 2rem;">🌿</span><br><b>SUKARELAWAN</b>
                </label>
                <label class="role-card" onclick="selectRole(this)">
                    <input type="radio" name="role" value="donate">
                    <span style="font-size: 2rem;">📦</span><br><b>SUMBANG DAUN</b>
                </label>
            </div>
            
            <input type="text" placeholder="Nama Penuh" class="luxury-input" required>
            <input type="email" placeholder="Alamat Emel" class="luxury-input" required>
            <button type="submit" class="nav-btn" style="width: 100%; padding: 20px;">HANTAR PERMOHONAN</button>
        </form>
    </div>
</main>

<script>
    function selectRole(elem) {
        document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        elem.classList.add('selected');
    }
</script>
