<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | NoveraGreen</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="brand-group">
                <img src="assets/images/logonovera.png" class="logo-img" style="height:25px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <span class="logo-fallback" style="font-weight:bold; color:white;">NOVERAGREEN</span>
                <span class="nav-divider"></span>
                <span class="sub-brand">by MinimallyFoliumTech</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Overview</a>
                <a href="index.html#process">Process</a>
                <a href="volunteer.html" class="active">Join Us</a>
                <a href="index.html#settings">Settings</a>
            </div>
        </div>
    </nav>

    <main class="section-padding">
        <h2 class="section-title" data-en="Be Part of the Future." data-ms="Jadilah Sebahagian daripada Masa Depan.">Be Part of the Future.</h2>
        <div class="bento-grid">
            <div class="bento-card full animate-card" style="max-width: 700px; margin: auto;">
                <h3 data-en="Stakeholder Application" data-ms="Permohonan Pihak Berkepentingan">Stakeholder Application</h3>
                <form action="thankyou.html">
                    <input type="text" class="input-apple" data-en-placeholder="Full Name" data-ms-placeholder="Nama Penuh" placeholder="Full Name" required>
                    <input type="email" class="input-apple" placeholder="Email Address" required>
                    <input type="tel" class="input-apple" placeholder="Phone Number" required>
                    <button type="submit" class="apple-btn" style="width: 100%; border: none; cursor: pointer;" data-en="Submit Application" data-ms="Hantar Permohonan">Submit Application</button>
                </form>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
