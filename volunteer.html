<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8"><title>Sertai Kami | Novera</title><link rel="stylesheet" href="style.css"></head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 20px;">
    <div class="glass-card" style="max-width: 600px; width: 100%; text-align: center;">
        <h2 class="title-gold">Sertai Pergerakan Kami</h2>
        <p style="margin-bottom: 30px; opacity: 0.7;">Pilih cara anda untuk membantu bumi.</p>
        
        <form action="thankyou.html">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <label style="border: 1px solid var(--border); padding: 20px; border-radius: 20px; cursor: pointer;">
                    <input type="radio" name="role" value="volunteer" required>
                    <div style="margin-top: 10px; font-weight: bold;">Sukarelawan</div>
                </label>
                <label style="border: 1px solid var(--border); padding: 20px; border-radius: 20px; cursor: pointer;">
                    <input type="radio" name="role" value="donate">
                    <div style="margin-top: 10px; font-weight: bold;">Sumbang Daun</div>
                </label>
            </div>
            <input type="text" placeholder="Nama Penuh" style="width: 100%; padding: 15px; background: none; border: 1px solid var(--border); border-radius: 10px; color: white; margin-bottom: 15px;">
            <button type="submit" class="action-btn" style="width: 100%;">HANTAR</button>
        </form>
    </div>
</body>
</html>
