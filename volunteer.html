<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertai NoveraGreen</title>
    <link rel="icon" type="image/png" href="assets/images/logonovera.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="leaf-container"></div>

    <nav class="navbar glass-nav">
        <div class="nav-content">
            <div class="brand">
                <img src="assets/images/logonovera.png" alt="Logo" class="main-logo">
                <div class="brand-text">
                    <span class="novera-text">NOVERA <span class="gold-text">GREEN</span></span>
                </div>
            </div>
            <div class="nav-links">
                <a href="index.html">Utama</a>
            </div>
        </div>
    </nav>

    <main class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 100px;">
        <div class="card glass" style="width: 100%; max-width: 600px;">
            <h2 class="playfair gold-text mb-4 text-center">Sertai Pergerakan Hijau</h2>
            <p class="text-center mb-5" style="opacity: 0.8;">Isi butiran di bawah. Jadikan sumbangan daun anda sebagai satu nilai baharu.</p>
            
            <form action="thankyou.html" method="GET">
                <input type="text" required placeholder="Nama Penuh">
                <input type="email" required placeholder="Alamat Emel">
                <input type="tel" required placeholder="No. Telefon">
                <select required>
                    <option value="" disabled selected>Pilih Peranan Anda</option>
                    <option value="volunteer">Sukarelawan</option>
                    <option value="contributor">Penyumbang Daun Kering</option>
                </select>
                <button type="submit" class="submit-btn">Hantar Permohonan</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
