<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertai Kami | Novera Green</title>
    <link rel="stylesheet" href="form.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div class="glass-card-form">
            <h2 class="form-title">Sertai Pergerakan</h2>
            <form action="thankyou.html" class="luxury-form">
                <div class="input-group">
                    <label>Nama Penuh</label>
                    <input type="text" placeholder="Ali Bin Abu" required>
                </div>
                <div class="input-group">
                    <label>Alamat Emel</label>
                    <input type="email" placeholder="ali@email.com" required>
                </div>
                <div class="input-group">
                    <label>Jenis Sumbangan</label>
                    <select>
                        <option>Sumbangan Daun Kering</option>
                        <option>Sukarelawan Tenaga Kerja</option>
                        <option>Dana Inovasi</option>
                    </select>
                </div>
                <button type="submit" class="gold-btn-submit">HANTAR SEKARANG</button>
            </form>
        </div>
    </div>
</body>
</html>
