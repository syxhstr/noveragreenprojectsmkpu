<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volunteer | NOVERA GREEN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    input, select, textarea {
      width: 100%; padding: 15px; margin: 10px 0 20px;
      background: var(--primary); border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 10px; color: white;
    }
    label { font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">NOVERA🌿</a>
    <ul class="nav-menu">
      <li class="nav-item"><a href="index.html" class="nav-link">🏠 <span>Home</span></a></li>
      <li class="nav-item"><a href="process.html" class="nav-link">🔄 <span>Process</span></a></li>
      <li class="nav-item"><a href="volunteer.html" class="nav-link active">🌿 <span>Volunteer</span></a></li>
    </ul>
  </aside>

  <main class="reveal">
    <div style="max-width: 700px; margin: 0 auto; background: var(--secondary); padding: 50px; border-radius: 30px;">
      <h1 style="color: var(--accent); margin-bottom: 20px;">Get Involved.</h1>
      <form action="thankyou.html">
        <label>Name</label>
        <input type="text" placeholder="Your full name" required>
        
        <label>Email</label>
        <input type="email" placeholder="email@example.com" required>

        <label>Contribution Type</label>
        <select>
          <option>Donate Dry Leaves</option>
          <option>Join Production Team</option>
          <option>Brand Partnership</option>
        </select>

        <button type="submit" style="background: var(--accent); width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer;">Submit Registration</button>
      </form>
    </div>
  </main>
</body>
</html>
