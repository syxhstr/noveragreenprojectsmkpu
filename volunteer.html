<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertai Kami | NoveraGreen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="brand-group">
                <img src="assets/images/logonovera.png" class="logo-img" alt="Logo">
                <span class="logo-sub">by MinimallyFoliumTech</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Utama</a>
                <a href="volunteer.html" class="active">Sertai Kami</a>
            </div>
        </div>
    </nav>

    <main class="section-padding">
        <h2 class="section-title">Join the Green Movement.</h2>
        <div class="bento-grid">
            <div class="bento-card full" style="max-width: 800px; margin: auto;">
                <h3>Sertai Pergerakan Hijau Kami</h3>
                <p>Isi borang di bawah untuk menjadi sebahagian daripada komuniti kelestarian NoveraGreen.</p>
                
                <form action="index.html" style="margin-top: 40px;">
                    <input type="text" placeholder="Nama Penuh" style="width:100%; padding:20px; margin-bottom:20px; border-radius:15px; border:none; background:rgba(255,255,255,0.03); color:white;" required>
                    <input type="email" placeholder="Alamat Emel" style="width:100%; padding:20px; margin-bottom:20px; border-radius:15px; border:none; background:rgba(255,255,255,0.03); color:white;" required>
                    <input type="tel" placeholder="No. Telefon" style="width:100%; padding:20px; margin-bottom:20px; border-radius:15px; border:none; background:rgba(255,255,255,0.03); color:white;" required>
                    <button type="submit" class="gold-btn" style="width: 100%;" onclick="alert('Pendaftaran Berjaya!')">Daftar Sekarang</button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
