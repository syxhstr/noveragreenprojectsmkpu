<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | NoveraGreen</title>
    <link rel="icon" type="image/png" href="assets/images/logonovera.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container">
            <a href="index.html" class="brand-group">
                <img src="assets/images/logonovera.png" class="logo-image" alt="NoveraGreen">
                <span class="divider"></span>
                <span class="logo-sub">by MinimallyFoliumTech</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Overview</a>
                <a href="volunteer.html" class="active">Join Us</a>
                <a href="index.html#settings">Settings</a>
            </div>
        </div>
    </nav>

    <main class="section-padding">
        <div class="section-header">
            <h2 class="section-title" data-en="Stakeholder Engagement" data-ms="Penglibatan Pihak Berkepentingan">Stakeholder Engagement</h2>
            <p class="section-sub" data-en="Join our mission to de-carbonize the stationery industry through bio-circular innovation." data-ms="Sertai misi kami untuk menyahkarbon industri alat tulis melalui inovasi bio-kitaran.">Join our mission to de-carbonize the stationery industry.</p>
        </div>
        
        <div class="bento-grid">
            <div class="bento-card half-full animate-card">
                <h3 class="card-title" data-en="Why NoveraGreen?" data-ms="Kenapa NoveraGreen?">Why NoveraGreen?</h3>
                <p class="card-body" data-en="We are scaling our Bio-Steam Hydrolysis plants to manage over 500 tons of urban leaf waste monthly. Whether you are an investor looking for ESG-compliant assets or a volunteer for our 'Green Collection' drive, your involvement helps prevent 2.5 tons of CO2 for every 1,000 units produced. Our model turns biological liabilities into premium economic assets." data-ms="Kami sedang memperluaskan loji Hidrolisis Bio-Stim kami untuk menguruskan lebih 500 tan sisa daun bandar setiap bulan. Sama ada anda pelabur atau sukarelawan, penglibatan anda membantu menghalang 2.5 tan CO2 bagi setiap 1,000 unit yang dihasilkan.">We are scaling our Bio-Steam Hydrolysis plants to manage urban waste...</p>
            </div>

            <div class="bento-card third animate-card">
                <form action="thankyou.html">
                    <input type="text" placeholder="Full Name" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; background:#2c2c2e; color:white;" required>
                    <input type="email" placeholder="Email Address" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; background:#2c2c2e; color:white;" required>
                    <input type="tel" placeholder="Phone Number" style="width:100%; padding:15px; margin-bottom:15px; border-radius:10px; border:none; background:#2c2c2e; color:white;" required>
                    
                    <select style="width:100%; padding:15px; margin-bottom:20px; border-radius:10px; border:none; background:#2c2c2e; color:white; cursor:pointer;" required>
                        <option value="" disabled selected>Interested as a...</option>
                        <option value="investor">Investor</option>
                        <option value="volunteer">Volunteer</option>
                        <option value="partner">Corporate Partner</option>
                        <option value="other">Other</option>
                    </select>
                    
                    <button type="submit" class="apple-btn" style="width:100%;">Submit Application</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
