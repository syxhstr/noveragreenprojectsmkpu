<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Sertai Kami | NoveraGreen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sub-page">
    <nav class="navbar glass-nav">
        <div class="nav-content">
            <div class="brand"><img src="assets/images/logonovera.png" class="main-logo"></div>
            <div class="nav-links"><a href="index.html">Kembali ke Utama</a></div>
        </div>
    </nav>
    <section class="section-island" style="margin-top: 150px;">
        <div class="card glass reveal">
            <h1 class="playfair gold-text">Daftar Sukarelawan</h1>
            <p>Isi borang di bawah untuk menyertai komuniti hijau kami.</p>
            <form action="thankyou.html" class="volunteer-form" style="margin-top: 30px;">
                <input type="text" placeholder="Nama Penuh" required class="form-input">
                <input type="email" placeholder="E-mel" required class="form-input">
                <textarea placeholder="Kenapa anda ingin sertai?" class="form-input"></textarea>
                <button type="submit" class="nav-btn" style="border:none; cursor:pointer; width:100%;">Hantar Permohonan</button>
            </form>
        </div>
    </section>
</body>
</html>
