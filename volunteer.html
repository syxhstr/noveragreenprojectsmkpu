<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertai Kami | Novera Green</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: radial-gradient(circle at center, #1a2e25 0%, #0b1a13 100%);">
    
    <nav class="navbar">
        <img src="assets/images/logonovera.png" style="height: 45px;">
        <a href="index.html" class="gold-btn" style="padding: 10px 25px; font-size: 0.7rem;">KEMBALI KE UTAMA</a>
    </nav>

    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="glass-card" style="width: 100%; max-width: 600px; margin-top: 50px;">
            <h2 style="text-align: center; margin-bottom: 10px;">Sertai Revolusi Hijau</h2>
            <p style="text-align: center; opacity: 0.6; margin-bottom: 40px;">Lengkapkan butiran anda di bawah.</p>
            
            <form action="thankyou.html">
                <input type="text" placeholder="Nama Penuh" class="luxury-input" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); padding:20px; border-radius:15px; color:white; margin-bottom:20px; outline:none;" required>
                <input type="email" placeholder="E-mel" class="luxury-input" style="width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); padding:20px; border-radius:15px; color:white; margin-bottom:20px; outline:none;" required>
                
                <select style="width:100%; background:var(--forest); border:1px solid var(--glass-border); padding:20px; border-radius:15px; color:white; margin-bottom:30px;">
                    <option>Sukarelawan</option>
                    <option>Penyumbang Daun Kering</option>
                    <option>Pelabur</option>
                </select>

                <button type="submit" class="gold-btn" style="width: 100%; border: none; cursor: pointer;">Hantar Permohonan</button>
            </form>
        </div>
    </main>
</body>
</html>
