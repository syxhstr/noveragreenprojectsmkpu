<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8"><title>Sertai Kami | Novera</title><link rel="stylesheet" href="style.css"></head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
    <nav class="glass-nav"><div class="nav-content"><a href="index.html"><img src="assets/images/logonovera.png" class="main-logo"></a></div></nav>
    
    <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:100px 0;">
        <div class="glass-card reveal" style="max-width:600px; text-align:center;">
            <h1 class="title-gold">Sertai Sukarelawan</h1>
            <form action="thankyou.html" style="display:flex; flex-direction:column; gap:20px;">

                <button type="submit" class="nav-btn" style="border:none; cursor:pointer;">HANTAR PERMOHONAN</button>
            </form>
            <a href="index.html" style="display:block; margin-top:20px; color:var(--gold); text-decoration:none; font-size:12px;">← BALIK KE UTAMA</a>
        </div>
    </div>

    <footer><div style="text-align:center; padding:30px; opacity:0.5; font-size:10px;">&copy; 2026 NOVERA GREEN</div></footer>
    <script src="script.js"></script>

</html>
