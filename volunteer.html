<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVERA | Network</title>
  <link rel="stylesheet" href="style.css">
  <style>
    input, select, textarea { 
      width: 100%; padding: 18px; background: var(--secondary); 
      border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 12px; 
      color: white; margin: 10px 0 25px; font-size: 1rem;
    }
    label { font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 0.8rem; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo">NOVERA.</a>
    <ul class="nav-menu">
      <li class="nav-item"><a href="index.html" class="nav-link">🏠 <span>Dashboard</span></a></li>
      <li class="nav-item"><a href="process.html" class="nav-link">🔄 <span>Systems</span></a></li>
      <li class="nav-item"><a href="volunteer.html" class="nav-link active">🌿 <span>Network</span></a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link">⚙️ <span>Control Panel</span></a></li>
    </ul>
  </aside>

  <main class="reveal">
    <h1>Global Network.</h1>
    <p class="big-text">Join the ranks of eco-engineers. Register your interest below.</p>

    <div class="card" style="max-width: 600px; transform: none !important;">
      <form action="thankyou.html">
        <label>Full Name</label>
        <input type="text" placeholder="John Doe" required>
        
        <label>Role</label>
        <select>
          <option>Biomass Contributor</option>
          <option>Lab Assistant</option>
          <option>Brand Partner</option>
        </select>
        
        <button type="submit" class="btn-accent" style="padding: 20px; font-size: 1.1rem;">INITIALIZE JOIN SEQUENCE</button>
      </form>
    </div>
  </main>
</body>
</html>
