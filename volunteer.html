<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Volunteer | NoveraGreen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="glass-nav">
        <div class="nav-content">
            <div class="brand"><img src="assets/images/logonovera.png" alt="Logo"></div>
            <ul class="nav-links"><li><a href="index.html">Kembali ke Utama</a></li></ul>
        </div>
    </nav>
    <section class="hero">
        <div class="hero-glass-box reveal" style="width: 100%; max-width: 600px; margin: 0 auto;">
            <h2 class="playfair gold-text" style="font-size: 2.5rem; margin-bottom: 30px;">Sertai Kami</h2>
            <form action="thankyou.html" class="volunteer-form">
                <div class="form-group"><input type="text" placeholder="Nama Penuh" required></div>
                <div class="form-group"><input type="email" placeholder="E-mel" required></div>
                <div class="form-group"><textarea placeholder="Tuliskan sumbangan anda..." rows="5"></textarea></div>
                <button type="submit" class="nav-btn" style="border:none; width:100%; cursor:pointer;">Hantar Permohonan</button>
            </form>
        </div>
    </section>
</body>
</html>
