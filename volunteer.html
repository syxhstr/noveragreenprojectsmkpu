<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Us | Novera</title>
    <link rel="stylesheet" href="style.css">
    <style>
        input, select {
            width: 100%; padding: 20px; margin-bottom: 20px;
            border-radius: 15px; border: 1px solid #ddd; font-size: 1rem;
        }
        .btn-submit {
            background: #000; color: #fff; border: none; padding: 20px;
            border-radius: 40px; width: 100%; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { transform: scale(1.02); opacity: 0.8; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <img src="assets/images/logonovera.png" class="main-logo" alt="Logo">
        <div class="nav-menu">
            <a href="index.html" class="nav-link" data-en="Overview" data-ms="Utama">Overview</a>
            <a href="process.html" class="nav-link" data-en="Process" data-ms="Proses">Process</a>
            <a href="impact.html" class="nav-link" data-en="Impact" data-ms="Impak">Impact</a>
            <a href="volunteer.html" class="nav-link active" data-en="Join Us" data-ms="Sertai Kami">Join Us</a>
            <a href="settings.html" class="nav-link" data-en="Settings" data-ms="Tetapan">Settings</a>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
            <button class="lang-btn" id="btn-ms" onclick="changeLang('ms')">MS</button>
        </div>
    </nav>

    <main>
        <section class="section">
            <h1 class="reveal" data-en="Join the<br>Movement." data-ms="Sertai<br>Gerakan Kami.">Join the<br>Movement.</h1>
            <div class="grid reveal">
                <div class="card" style="grid-column: span 12; max-width: 600px;">
                    <form action="#">
                        <input type="text" data-en-placeholder="Full Name" data-ms-placeholder="Nama Penuh" placeholder="Full Name" required>
                        <input type="email" data-en-placeholder="Email Address" data-ms-placeholder="Alamat Emel" placeholder="Email Address" required>
                        <select>
                            <option data-en="Leaf Donor" data-ms="Penderma Daun">Leaf Donor</option>
                            <option data-en="Volunteer" data-ms="Sukarelawan">Volunteer</option>
                            <option data-en="Business Partner" data-ms="Rakan Bisnes">Business Partner</option>
                        </select>
                        <button type="submit" class="btn-submit" data-en="Send Request" data-ms="Hantar Permohonan">Send Request</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.to(".reveal", { opacity: 1, y: 0, duration: 1, ease: "power3.out" });
        function changeLang(l) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + l);
            });
            
            // Tukar placeholder borang
            document.querySelectorAll('[data-en-placeholder]').forEach(el => {
                el.placeholder = el.getAttribute('data-' + l + '-placeholder');
            });
        }
    </script>
</body>
