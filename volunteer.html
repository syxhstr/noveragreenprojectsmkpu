<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer | NOVERA GREEN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">NOVERA🌿</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="process.html">Process</a></li>
      <li><a href="volunteer.html">Volunteer</a></li>
    </ul>
  </nav>

  <header class="hero" style="padding: 150px 20px 50px;">
    <h1>Start Contributing.</h1>
    <p>Fill in the details below to schedule a leaf collection or join our production team.</p>
  </header>

  <section class="container" style="margin-top: -50px;">
    <div class="form-card fade-in">
      <form action="thankyou.html" method="GET">
        <label>Full Name</label>
        <input type="text" placeholder="e.g. Ahmad Fauzi" required>
        
        <label>Email Address</label>
        <input type="email" placeholder="ahmad@email.com" required>

        <label>How can you help?</label>
        <select required>
          <option value="">Select an option</option>
          <option value="donate">I want to donate dry leaves</option>
          <option value="worker">I want to help with production</option>
          <option value="brand">I want to be a brand partner</option>
        </select>

        <label>Estimate Weight (kg) - For leaf donors</label>
        <input type="number" placeholder="e.g. 5">

        <button type="submit" class="btn" style="width: 100%;">Submit Application</button>
      </form>
    </div>
  </section>

</body>
</html>
